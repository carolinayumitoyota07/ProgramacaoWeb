<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interface de um jogo de palavras com tabuleiro e teclado, construída com HTML e CSS.">
  <meta name="theme-color" content="#202123">
  <title>TERMO — Jogo de palavras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="jogo" aria-labelledby="titulo">
    <header class="cabecalho">
      <details class="ajuda">
        <summary aria-label="Como interpretar as letras">?</summary>
        <div class="painel-ajuda">
          <p>Observe a cor de cada letra para descobrir uma palavra de cinco letras.</p>
          <ul>
            <li><span class="amostra correta" aria-hidden="true">A</span> Verde: letra na posição correta</li>
            <li><span class="amostra posicao-errada" aria-hidden="true">E</span> Amarelo: letra em outra posição</li>
            <li><span class="amostra incorreta" aria-hidden="true">C</span> Cinza: letra ausente ou sem outra ocorrência disponível</li>
          </ul>
        </div>
      </details>
      <h1 id="titulo">TERMO</h1>
      <span class="idioma" aria-label="Palavras em português">PT</span>
    </header>

    <!-- Cada linha contém cinco células; o tabuleiro tem seis linhas. -->
    <!-- As cores das duas tentativas são coerentes com a palavra de exemplo SABER. -->
    <section class="tabuleiro" aria-label="Tabuleiro com seis tentativas de cinco letras">
      <div class="linha" role="group" aria-label="Primeira tentativa: CASAL">
        <div class="celula incorreta" aria-label="C: letra ausente">C</div>
        <div class="celula correta" aria-label="A: posição correta">A</div>
        <div class="celula posicao-errada" aria-label="S: posição errada">S</div>
        <div class="celula incorreta" aria-label="A: não há outra ocorrência na palavra">A</div>
        <div class="celula incorreta" aria-label="L: letra ausente">L</div>
      </div>
      <div class="linha" role="group" aria-label="Segunda tentativa: PEDRA">
        <div class="celula incorreta" aria-label="P: letra ausente">P</div>
        <div class="celula posicao-errada" aria-label="E: posição errada">E</div>
        <div class="celula incorreta" aria-label="D: letra ausente">D</div>
        <div class="celula posicao-errada" aria-label="R: posição errada">R</div>
        <div class="celula posicao-errada" aria-label="A: posição errada">A</div>
      </div>
      <div class="linha" role="group" aria-label="Terceira tentativa, vazia; primeira posição selecionada">
        <div class="celula selecionada" aria-label="Posição selecionada"></div>
        <div class="celula"></div>
        <div class="celula"></div>
        <div class="celula"></div>
        <div class="celula"></div>
      </div>
      <div class="linha" role="group" aria-label="Quarta tentativa, vazia">
        <div class="celula"></div>
        <div class="celula"></div>
        <div class="celula"></div>
        <div class="celula"></div>
        <div class="celula"></div>
      </div>
      <div class="linha" role="group" aria-label="Quinta tentativa, vazia">
        <div class="celula"></div>
        <div class="celula"></div>
        <div class="celula"></div>
        <div class="celula"></div>
        <div class="celula"></div>
      </div>
      <div class="linha" role="group" aria-label="Sexta tentativa, vazia">
        <div class="celula"></div>
        <div class="celula"></div>
        <div class="celula"></div>
        <div class="celula"></div>
        <div class="celula"></div>
      </div>
    </section>

    <section class="teclado" aria-label="Teclado virtual ilustrativo" aria-describedby="aviso-interface">
      <div class="linha-teclado">
        <button class="tecla" type="button">Q</button>
        <button class="tecla" type="button">W</button>
        <button class="tecla posicao-errada" type="button" aria-label="E: presente em outra posição">E</button>
        <button class="tecla posicao-errada" type="button" aria-label="R: presente em outra posição">R</button>
        <button class="tecla" type="button">T</button>
        <button class="tecla" type="button">Y</button>
        <button class="tecla" type="button">U</button>
        <button class="tecla" type="button">I</button>
        <button class="tecla" type="button">O</button>
        <button class="tecla incorreta" type="button" aria-label="P: letra ausente">P</button>
      </div>
      <div class="linha-teclado linha-intermediaria">
        <button class="tecla correta" type="button" aria-label="A: já encontrada na posição correta">A</button>
        <button class="tecla posicao-errada" type="button" aria-label="S: presente em outra posição">S</button>
        <button class="tecla incorreta" type="button" aria-label="D: letra ausente">D</button>
        <button class="tecla" type="button">F</button>
        <button class="tecla" type="button">G</button>
        <button class="tecla" type="button">H</button>
        <button class="tecla" type="button">J</button>
        <button class="tecla" type="button">K</button>
        <button class="tecla incorreta" type="button" aria-label="L: letra ausente">L</button>
      </div>
      <div class="linha-teclado">
        <button class="tecla tecla-especial" type="button" aria-label="Confirmar palavra">Enter</button>
        <button class="tecla" type="button">Z</button>
        <button class="tecla" type="button">X</button>
        <button class="tecla incorreta" type="button" aria-label="C: letra ausente">C</button>
        <button class="tecla" type="button">V</button>
        <button class="tecla" type="button">B</button>
        <button class="tecla" type="button">N</button>
        <button class="tecla" type="button">M</button>
        <button class="tecla tecla-especial apagar" type="button" aria-label="Apagar última letra">⌫</button>
      </div>
    </section>
  </main>
</body>
</html>
